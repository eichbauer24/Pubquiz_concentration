<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Common</title>
<meta name="description" content="Pub quiz preparation for the theme common: a briefing, flashcards, timed lists and rapid recall.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf7f2; --card:#fff; --ink:#1a1a22; --grey:#6a6a78;
  --rule:#e3ddd3; --accent:#4b3f8f; --ochre:#a8761a; --wash:#f1ede5;
  --yes:#2b7556; --no:#b03a4a;
  --disp:"Instrument Serif",Georgia,serif;
  --bar:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14141b; --card:#1d1d27; --ink:#eeecf2; --grey:#9b9aa9;
  --rule:#2e2e3c; --accent:#ab9ef0; --ochre:#e0b35e; --wash:#24242f;
  --yes:#5dbd94; --no:#e87d8b;
}}
:root[data-theme="dark"]{
  --paper:#14141b; --card:#1d1d27; --ink:#eeecf2; --grey:#9b9aa9;
  --rule:#2e2e3c; --accent:#ab9ef0; --ochre:#e0b35e; --wash:#24242f;
  --yes:#5dbd94; --no:#e87d8b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-family:var(--disp);font-weight:400;line-height:1.05;letter-spacing:-.01em}
h3{margin:0;font-size:.95rem;font-weight:700;line-height:1.2}
p{margin:.45rem 0}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

/* ---- segmented tab bar, the only fixed chrome ---- */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(8px + env(safe-area-inset-top,0)) 0 8px;border-bottom:1px solid var(--rule)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--wash);
  border-radius:9px;padding:3px}
@media (min-width:600px){.seg{grid-template-columns:repeat(6,1fr)}}
.seg button{font:600 .86rem/1 inherit;border:0;background:none;color:var(--grey);
  padding:10px 4px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-current="true"]{background:var(--card);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){.seg button[aria-current="true"]{box-shadow:none}}

main{padding:16px 0 40px}
.view[hidden]{display:none}
.row{display:flex;gap:8px;align-items:center}
.wraprow{flex-wrap:wrap}
.between{justify-content:space-between}
.grey{color:var(--grey);font-size:.86rem}
.btn{font:600 .9rem/1 inherit;border:1px solid var(--rule);background:var(--wash);color:var(--ink);
  border-radius:8px;padding:12px 16px;cursor:pointer}
.btn.go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.yes{background:none;border-color:var(--yes);color:var(--yes)}
.btn.no{background:none;border-color:var(--no);color:var(--no)}
.btn.full{width:100%;text-align:center}
.btn.lite{border:0;background:none;color:var(--grey);font-weight:500;padding:10px 6px}
.btn:disabled{opacity:.45;cursor:default}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---- briefing ---- */
.brief .hero{padding:4px 0 22px;border-bottom:1px solid var(--rule)}
.brief h1{font-size:clamp(2.4rem,11vw,3.4rem)}
.brief .lede{color:var(--grey);font-size:.95rem;max-width:46ch;margin-top:6px}
.brief .quote{font-family:var(--disp);font-style:italic;font-size:1.12rem;color:var(--accent);
  margin-top:14px;line-height:1.35}
.brief .quote b{font-style:normal}
.brief section{padding:20px 0;border-bottom:1px solid var(--rule)}
.brief .head{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.brief .num{font-family:var(--disp);font-size:1.1rem;color:var(--ochre);min-width:1.5rem}
.brief h3{font-size:1.18rem;font-family:var(--disp);font-weight:400}
.brief .body{padding-left:calc(1.5rem + 10px);font-size:.97rem}
.brief ul{margin:.5rem 0;padding-left:1.05rem}
.brief li{margin:.34rem 0}
.brief b{color:var(--accent);font-weight:600}
.brief .rank{list-style:none;padding:0}
.brief .rank li{padding:5px 0;border-bottom:1px solid var(--rule);margin:0}
.brief .rank li:last-child{border-bottom:0}
@media (max-width:460px){.brief .body{padding-left:0}}

/* ---- cards ---- */
.deckbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.deckbar::-webkit-scrollbar{display:none}
.deckbar button{flex:none;font:600 .82rem/1 inherit;border:1px solid var(--rule);background:none;
  color:var(--grey);border-radius:99px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.deckbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--rule);font-size:.78rem}
.card .cat{font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ochre)}
.card .q{font-family:var(--disp);font-size:clamp(1.4rem,5.4vw,1.75rem);line-height:1.18;
  padding:20px 16px;min-height:4.6em;display:flex;align-items:center}
.card .ans{padding:16px;border-top:1px solid var(--rule);background:var(--wash);
  font-size:1.02rem;min-height:4.2em;display:flex;align-items:center}
.card .ans>div{width:100%}
.card .ans b{display:block;margin-bottom:2px}
.card .ans.hide{color:transparent;user-select:none}
.card .ans.hide *{color:transparent!important}
.card .acts{padding:12px 16px 14px;display:grid;gap:8px}
.shot{position:relative;width:100%;aspect-ratio:4/3;background:var(--wash);
  display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--rule)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{padding:16px;text-align:center;color:var(--grey);font-size:.86rem}
.cred{font-size:.72rem;color:var(--grey);text-align:right;padding:5px 12px 0;min-height:1.1em}
.cred a{color:var(--grey)}
.track{height:3px;background:var(--wash)}
.track i{display:block;height:100%;background:var(--yes);transition:width .3s}

/* ---- lists ---- */
.pick{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);border-radius:10px;padding:13px 15px;margin:0 0 8px;cursor:pointer;font:inherit}
.pick .t{font-family:var(--disp);font-size:1.14rem;line-height:1.2}
.pick .m{display:flex;gap:10px;color:var(--grey);font-size:.8rem;margin-top:4px}
.pick .m .done{color:var(--yes);font-weight:600}
.runhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.runhead .t{font-family:var(--disp);font-size:1.25rem;line-height:1.15}
.gauge{display:flex;align-items:baseline;gap:4px}
.gauge .big{font-family:var(--disp);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.gauge .sub{color:var(--grey);font-size:.84rem}
.gauge.time .big.low{color:var(--no)}
.stats{display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 0 8px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.sheet{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.sheet li{counter-increment:s;display:grid;grid-template-columns:1.7rem 1fr;gap:8px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule);font-size:.95rem}
.sheet li::before{content:counter(s) ".";color:var(--grey);font-size:.82rem;font-variant-numeric:tabular-nums}
.sheet li .blank{display:block;height:1.1em;border-bottom:1px dashed var(--rule)}
.sheet li.got{color:var(--ink)}
.sheet li.got span{font-weight:600}
.sheet li.shown span{color:var(--no)}
.typebar{position:sticky;bottom:0;background:var(--paper);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0));
  border-top:1px solid var(--rule);margin-top:4px}
input[type=text]{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--rule);
  border-radius:9px;background:var(--card);color:var(--ink)}

/* ---- rapid ---- */
.rapid .q{font-family:var(--disp);font-size:clamp(1.35rem,5.2vw,1.7rem);line-height:1.2;
  min-height:3.4em;display:flex;align-items:center}
.feed{min-height:2.4em;font-size:.9rem;padding:9px 12px;border-radius:8px;background:var(--wash);
  margin:12px 0 4px;color:var(--grey);display:flex;align-items:center}
.feed.ok{border-left:3px solid var(--yes)}
.feed.bad{border-left:3px solid var(--no)}

.foot{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 28px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  color:var(--grey);font-size:.8rem}
</style>
</head>

<div class="bar"><div class="wrap"><div class="seg" id="tabs"></div></div></div>

</main>

const el=function(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const $=function(s){return document.querySelector(s);};
const shuffle=function(a){return a.map(function(v){return [Math.random(),v];})
  .sort(function(x,y){return x[0]-y[0];}).map(function(v){return v[1];});};
const mmss=function(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const norm=function(s){return (s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\b(the|a|an|der|die|das|den|dem|of|von|und|and|in|at)\b/g," ")
  .replace(/\s+/g," ").trim();};
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 99;
  let p=Array.from({length:n+1},function(_,j){return j;});
  for(let i=1;i<=m;i++){const c=[i];
    for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];}
function hits(given,correct,alts){
  const g=norm(given);if(!g)return false;
  const pool=[correct].concat(alts||[]).map(norm);
  for(let i=0;i<pool.length;i++){const c=pool[i];if(!c)continue;
    if(g===c)return true;
    const mn=Math.min(g.length,c.length);
    if(mn<=4)continue;
    if(c.indexOf(g)>=0||g.indexOf(c)>=0)return true;
    if(lev(g,c)<=(mn>=12?2:1))return true;}
  return false;}

let cat="All",deck=[],pos=0,shown=false;
const cats=["All"].concat(CARDS.map(function(c){return c[0];}).filter(function(v,i,a){return a.indexOf(v)===i;}));
const inCat=function(i){return cat==="All"||CARDS[i][0]===cat;};
function buildDeck(){
  const w=[];
  CARDS.map(function(_,i){return i;}).filter(inCat).forEach(function(i){
    const r=6-Math.min(box(i),5);for(let k=0;k<r;k++)w.push(i);});
  deck=shuffle(w);pos=0;}
function cards(){
  const v=$("#v-cards");v.innerHTML="";
  if(!deck.length)buildDeck();
  const pool=CARDS.map(function(_,i){return i;}).filter(inCat);
  const learned=pool.filter(function(i){return box(i)>=4;}).length;
  const i=deck[pos%deck.length];

  const bar=el("div","deckbar");
  cats.forEach(function(c){
    const x=el("button");x.textContent=c;x.setAttribute("aria-pressed",c===cat);
    x.onclick=function(){cat=c;buildDeck();shown=false;cards();};bar.appendChild(x);});
  v.appendChild(bar);

  const card=el("div","card");
  const top=el("div","top");
  top.appendChild(el("span","cat",CARDS[i][0]));
  top.appendChild(el("span","grey",learned+" of "+pool.length+" learned"));
  card.appendChild(top);
  card.appendChild(el("div","q",CARDS[i][1]));
  const ans=el("div","ans"+(shown?"":" hide"),"<div>"+CARDS[i][2]+"</div>");
  card.appendChild(ans);
  const acts=el("div","acts");
  if(!shown){
    const b=el("button","btn go full");b.textContent="Show answer";
    b.onclick=function(){shown=true;cards();};
    acts.appendChild(b);
    const sk=el("button","btn lite");sk.textContent="Skip this one";
    sk.onclick=function(){pos++;shown=false;cards();};
    acts.appendChild(sk);
  }else{
    const pair=el("div","pair");
    const y=el("button","btn yes");y.textContent="Knew it";
    y.onclick=function(){setBox(i,Math.min(box(i)+1,5));pos++;if(pos%10===0)buildDeck();shown=false;cards();};
    const n=el("button","btn no");n.textContent="Missed";
    n.onclick=function(){setBox(i,1);pos++;shown=false;cards();};
    pair.appendChild(y);pair.appendChild(n);
    acts.appendChild(pair);
  }
  card.appendChild(acts);
  card.appendChild(el("div","track",'<i style="width:'+(pool.length?learned/pool.length*100:0)+'%"></i>'));
  v.appendChild(card);}

function runList(n){
  const L=LISTS[n],v=$("#v-lists");v.innerHTML="";
  const got=L.i.map(function(){return false;});
  let left=L.s,timer=null,over=false;

  const head=el("div","runhead");
  head.appendChild(el("div","t",L.t));
  const close=el("button","btn lite");close.textContent="Close";close.onclick=function(){clearInterval(timer);lists();};
  head.appendChild(close);
  v.appendChild(head);

  const stats=el("div","stats");
  const gFound=el("div","gauge");
  const nFound=el("span","big","0");
  gFound.appendChild(nFound);gFound.appendChild(el("span","sub","of "+L.i.length+" found"));
  const gTime=el("div","gauge time");
  const nTime=el("span","big",mmss(left));
  gTime.appendChild(nTime);gTime.appendChild(el("span","sub","left"));
  stats.appendChild(gFound);stats.appendChild(gTime);
  v.appendChild(stats);
  const track=el("div","track");track.style.marginTop="0";
  const fill=el("i");fill.style.width="0%";track.appendChild(fill);
  v.appendChild(track);

  const sheet=el("ol","sheet");
  L.i.forEach(function(){
    const li=document.createElement("li");
    li.appendChild(el("span","blank",""));
    sheet.appendChild(li);});
  v.appendChild(sheet);

  const typebar=el("div","typebar");
  const inp=document.createElement("input");inp.type="text";
  inp.placeholder="an answer, then enter";inp.autocapitalize="off";inp.autocomplete="off";
  typebar.appendChild(inp);
  const giveup=el("button","btn lite");giveup.textContent="Give up and show the rest";
  giveup.style.marginTop="4px";
  typebar.appendChild(giveup);
  v.appendChild(typebar);

  function paint(){
    let c=0;
    got.forEach(function(f,k){
      if(f){c++;const li=sheet.children[k];
        if(!li.classList.contains("got")){li.classList.add("got");li.innerHTML="<span>"+L.i[k][0]+"</span>";}}});
    nFound.textContent=String(c);
    fill.style.width=(c/L.i.length*100)+"%";
    return c;}
  function finish(reveal){
    if(over)return;over=true;clearInterval(timer);inp.disabled=true;
    const c=paint();
    if(reveal)got.forEach(function(f,k){if(!f){const li=sheet.children[k];
      li.classList.add("shown");li.innerHTML="<span>"+L.i[k][0]+"</span>";}});
    if(S.best["L"+n]===undefined||c>S.best["L"+n]){S.best["L"+n]=c;save();}
    nTime.textContent="—";nTime.classList.remove("low");
    gTime.lastChild.textContent=c===L.i.length?"all found":"time up";
    typebar.innerHTML="";
    const again=el("button","btn go full");again.textContent="Run it again";
    again.onclick=function(){runList(n);};
    const all=el("button","btn lite");all.textContent="Back to the lists";
    all.style.marginTop="4px";all.onclick=lists;
    typebar.appendChild(again);typebar.appendChild(all);}
  giveup.onclick=function(){finish(true);};
  inp.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    const g=inp.value;inp.value="";if(!g.trim())return;
    for(let k=0;k<L.i.length;k++){if(!got[k]&&hits(g,L.i[k][0],L.i[k][1])){got[k]=true;break;}}
    if(paint()===L.i.length)finish(false);});
  timer=setInterval(function(){
    left--;nTime.textContent=mmss(Math.max(left,0));
    nTime.classList.toggle("low",left<=10);
    if(left<=0)finish(true);},1000);
  setTimeout(function(){try{inp.focus();}catch(e){}},60);}

/* ---------------- rapid ---------------- */
function rapid(){
  const v=$("#v-rapid");v.innerHTML="";
  v.appendChild(el("p","grey","Ninety seconds of the deck, typed. Producing an answer under time pressure is its own skill, separate from knowing it."));
  const go=el("button","btn go full");go.textContent="Start 90 seconds";
  go.style.marginTop="14px";go.onclick=runRapid;v.appendChild(go);}

function runRapid(){
  const v=$("#v-rapid");v.innerHTML="";
  const order=shuffle(CARDS.map(function(_,i){return i;}));
  let p=0,right=0,asked=0,left=90,timer=null,over=false;

  const stats=el("div","stats");
  const gScore=el("div","gauge");
  const nScore=el("span","big","0");
  gScore.appendChild(nScore);gScore.appendChild(el("span","sub","correct"));
  const gTime=el("div","gauge time");
  const nTime=el("span","big","1:30");
  gTime.appendChild(nTime);gTime.appendChild(el("span","sub","left"));
  stats.appendChild(gScore);stats.appendChild(gTime);
  v.appendChild(stats);

  const fb=el("div","feed","Type what you can; pass if nothing comes.");
  v.appendChild(fb);
  const q=el("div","q","");
  v.appendChild(q);
  const typebar=el("div","typebar");
  const inp=document.createElement("input");inp.type="text";
  inp.placeholder="answer, then enter";inp.autocapitalize="off";inp.autocomplete="off";
  typebar.appendChild(inp);
  const pass=el("button","btn lite");pass.textContent="Pass";
  pass.style.marginTop="4px";typebar.appendChild(pass);
  v.appendChild(typebar);

  let cur=order[0];
  const show=function(){cur=order[p%order.length];q.textContent=CARDS[cur][1];};
  show();
  const judge=function(ok){
    asked++;
    fb.className="feed "+(ok?"ok":"bad");
    fb.textContent=(ok?"✓ ":"✗ ")+CARDS[cur][2];
    if(ok){right++;setBox(cur,Math.min(box(cur)+1,5));}else setBox(cur,1);
    nScore.textContent=String(right);p++;show();inp.value="";};
  inp.addEventListener("keydown",function(e){
    if(e.key!=="Enter"||over)return;judge(hits(inp.value,CARDS[cur][2],CARDS[cur][3]));});
  pass.onclick=function(){if(!over)judge(false);};
  timer=setInterval(function(){
    left--;nTime.textContent=mmss(Math.max(left,0));nTime.classList.toggle("low",left<=10);
    if(left<=0){over=true;clearInterval(timer);inp.disabled=true;
      nTime.textContent="—";gTime.lastChild.textContent="time up";
      q.textContent=right+" of "+asked+" correct";
      fb.className="feed";
      fb.textContent=right+" answers in ninety seconds, "+(asked?Math.round(right/asked*100):0)+" per cent right.";
      typebar.innerHTML="";
      const again=el("button","btn go full");again.textContent="Go again";again.onclick=runRapid;
      typebar.appendChild(again);}
  },1000);
  setTimeout(function(){try{inp.focus();}catch(e){}},60);}


/* ---------------- wikipedia photos, cached ---------------- */
const IKEY="common-img";let IMG={};
try{const r=localStorage.getItem(IKEY);if(r)IMG=JSON.parse(r);}catch(e){}
function wiki(title){
  if(!title)return Promise.resolve(null);
  if(IMG[title]!==undefined)return Promise.resolve(IMG[title]);
  const L=["en","de"];
  const go=function(k){
    if(k>=L.length){IMG[title]=null;try{localStorage.setItem(IKEY,JSON.stringify(IMG));}catch(e){}return null;}
    return fetch("https://"+L[k]+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)+"?redirect=true")
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){
        const src=j&&((j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source));
        if(src){IMG[title]={src:src,page:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page};
          try{localStorage.setItem(IKEY,JSON.stringify(IMG));}catch(e){}return IMG[title];}
        return go(k+1);}).catch(function(){return go(k+1);});};
  return go(0);}

/* ---------------- pictures ---------------- */
let pcat="All",pdeck=[],ppos=0,pshown=false;
const pcats=["All"].concat(PICS.map(function(c){return c[2];}).filter(function(v,i,a){return a.indexOf(v)===i;}));
const pIn=function(i){return pcat==="All"||PICS[i][2]===pcat;};
const pBox=function(i){return S.box["p"+i]||1;};
const pSet=function(i,v){S.box["p"+i]=v;save();};
function pBuild(){
  const w=[];
  PICS.map(function(_,i){return i;}).filter(pIn).forEach(function(i){
    const r=6-Math.min(pBox(i),5);for(let k=0;k<r;k++)w.push(i);});
  pdeck=shuffle(w);ppos=0;}
function pics(){
  const v=$("#v-pics");v.innerHTML="";
  if(!pdeck.length)pBuild();
  const pool=PICS.map(function(_,i){return i;}).filter(pIn);
  const learned=pool.filter(function(i){return pBox(i)>=4;}).length;
  const i=pdeck[ppos%pdeck.length];

  const bar=el("div","deckbar");
  pcats.forEach(function(c){
    const x=el("button");x.textContent=c;x.setAttribute("aria-pressed",c===pcat);
    x.onclick=function(){pcat=c;pBuild();pshown=false;pics();};bar.appendChild(x);});
  v.appendChild(bar);

  const card=el("div","card");
  const top=el("div","top");
  top.appendChild(el("span","cat",PICS[i][2]));
  top.appendChild(el("span","grey",learned+" of "+pool.length+" learned"));
  card.appendChild(top);

  const shot=el("div","shot");
  const ph=el("div","ph","loading picture…");shot.appendChild(ph);
  const cred=el("div","cred");
  wiki(PICS[i][3]).then(function(rec){
    if(!rec){ph.textContent="no picture available";return;}
    const im=new Image();im.alt="Picture to identify";im.decoding="async";
    im.onload=function(){ph.remove();shot.prepend(im);};
    im.onerror=function(){ph.textContent="no picture available";};
    im.src=rec.src;
    if(pshown&&rec.page)cred.innerHTML='<a href="'+rec.page+'" target="_blank" rel="noopener">source: Wikipedia</a>';});
  card.appendChild(shot);
  card.appendChild(cred);

  const ans=el("div","ans"+(pshown?"":" hide"),
    "<div><b>"+PICS[i][0]+"</b>"+PICS[i][1]+"</div>");
  card.appendChild(ans);
  const acts=el("div","acts");
  if(!pshown){
    const b=el("button","btn go full");b.textContent="Show answer";
    b.onclick=function(){pshown=true;pics();};acts.appendChild(b);
    const sk=el("button","btn lite");sk.textContent="Skip this one";
    sk.onclick=function(){ppos++;pshown=false;pics();};acts.appendChild(sk);
  }else{
    const pair=el("div","pair");
    const y=el("button","btn yes");y.textContent="Knew it";
    y.onclick=function(){pSet(i,Math.min(pBox(i)+1,5));ppos++;if(ppos%10===0)pBuild();pshown=false;pics();};
    const n=el("button","btn no");n.textContent="Missed";
    n.onclick=function(){pSet(i,1);ppos++;pshown=false;pics();};
    pair.appendChild(y);pair.appendChild(n);acts.appendChild(pair);}
  card.appendChild(acts);
  card.appendChild(el("div","track",'<i style="width:'+(pool.length?learned/pool.length*100:0)+'%"></i>'));
  v.appendChild(card);}

/* ---------------- music ---------------- */
let mdeck=[],mpos=0,mshown=false;
const mBox=function(i){return S.box["m"+i]||1;};
const mSet=function(i,v){S.box["m"+i]=v;save();};
function mBuild(){
  const w=[];
  SONGS.forEach(function(_,i){const r=6-Math.min(mBox(i),5);for(let k=0;k<r;k++)w.push(i);});
  mdeck=shuffle(w);mpos=0;}
function music(){
  const v=$("#v-music");v.innerHTML="";
  if(!mdeck.length)mBuild();
  const learned=SONGS.filter(function(_,i){return mBox(i)>=4;}).length;
  const i=mdeck[mpos%mdeck.length];
  v.appendChild(el("p","grey","No audio here, so you get the clue instead. On the night he plays the track and wants the title and the artist — practise naming both."));
  const card=el("div","card");card.style.marginTop="12px";
  const top=el("div","top");
  top.appendChild(el("span","cat","Name the song"));
  top.appendChild(el("span","grey",learned+" of "+SONGS.length+" learned"));
  card.appendChild(top);
  card.appendChild(el("div","q",SONGS[i][3]));
  const ans=el("div","ans"+(mshown?"":" hide"),
    "<div><b>"+SONGS[i][0]+"</b>"+SONGS[i][1]+", "+SONGS[i][2]+"</div>");
  card.appendChild(ans);
  const acts=el("div","acts");
  if(!mshown){
    const b=el("button","btn go full");b.textContent="Show title and artist";
    b.onclick=function(){mshown=true;music();};acts.appendChild(b);
    const sk=el("button","btn lite");sk.textContent="Skip this one";
    sk.onclick=function(){mpos++;mshown=false;music();};acts.appendChild(sk);
  }else{
    const pair=el("div","pair");
    const y=el("button","btn yes");y.textContent="Knew both";
    y.onclick=function(){mSet(i,Math.min(mBox(i)+1,5));mpos++;if(mpos%8===0)mBuild();mshown=false;music();};
    const n=el("button","btn no");n.textContent="Missed";
    n.onclick=function(){mSet(i,1);mpos++;mshown=false;music();};
    pair.appendChild(y);pair.appendChild(n);acts.appendChild(pair);}
  card.appendChild(acts);
  card.appendChild(el("div","track",'<i style="width:'+(learned/SONGS.length*100)+'%"></i>'));
  v.appendChild(card);}

/* ---------------- nav ---------------- */
const TABS=[["brief","Briefing"],["cards","Cards"],["pics","Pictures"],
            ["music","Music"],["lists","Lists"],["rapid","Rapid"]];
const tabs=$("#tabs");
TABS.forEach(function(t){
  const x=el("button");x.textContent=t[1];x.dataset.v=t[0];
  x.onclick=function(){select(t[0]);};tabs.appendChild(x);});
function select(id){
  TABS.forEach(function(t){$("#v-"+t[0]).hidden=(t[0]!==id);});
  tabs.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-current",x.dataset.v===id);});
  if(id==="brief")brief();
  if(id==="cards"){shown=false;cards();}
  if(id==="pics"){pshown=false;pics();}
  if(id==="music"){mshown=false;music();}
  if(id==="lists")lists();
  if(id==="rapid")rapid();
  try{history.replaceState(null,"","#"+id);}catch(e){}
  window.scrollTo(0,0);}
$("#wipe").onclick=function(){
  if(!confirm("Delete all progress and best scores?"))return;
  S={box:{},best:{}};save();buildDeck();pBuild();mBuild();select("brief");};
buildDeck();pBuild();mBuild();
select(TABS.some(function(t){return t[0]===location.hash.slice(1);})?location.hash.slice(1):"brief");
</script>
