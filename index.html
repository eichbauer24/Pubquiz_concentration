const shuffle=function(a){return a.map(function(v){return [Math.random(),v];})
  .sort(function(x,y){return x[0]-y[0];}).map(function(v){return v[1];});};
const norm=function(s){return (s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an|der|die|das|den|dem|of|von|in)\b/g," ")
  .replace(/\s+/g," ").trim();};
function matches(given,correct,alts){
  const g=norm(given);
  if(g.length<2)return false;
  const pool=[correct].concat(alts||[]).map(norm);
  for(let i=0;i<pool.length;i++){
    const c=pool[i];
    if(!c)continue;
    if(g===c)return true;
    if(g.length>=4&&(c.indexOf(g)>=0||g.indexOf(c)>=0))return true;
    if(lev(g,c)<=(g.length>8?2:1))return true;
  }
  return false;
}
function lev(a,b){
  const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 99;
  let prev=Array.from({length:n+1},function(_,j){return j;});
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}

/* Wikipedia photos, cached */
const IMGKEY="bt-img";
let IMG={};try{const r=localStorage.getItem(IMGKEY);if(r)IMG=JSON.parse(r);}catch(e){}
function wikiPhoto(title){
  if(!title)return Promise.resolve(null);
  if(IMG[title]!==undefined)return Promise.resolve(IMG[title]);
  const langs=["en","de"];
  const tryLang=function(k){
    if(k>=langs.length){IMG[title]=null;try{localStorage.setItem(IMGKEY,JSON.stringify(IMG));}catch(e){}return null;}
    return fetch("https://"+langs[k]+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)+"?redirect=true")
      .then(function(r){return r.ok?r.json():null;})
      .then(function(j){
        const src=j&&((j.originalimage&&j.originalimage.width<=2400&&j.originalimage.source)||(j.thumbnail&&j.thumbnail.source));
        if(src){IMG[title]={src:src,page:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page};
          try{localStorage.setItem(IMGKEY,JSON.stringify(IMG));}catch(e){}
          return IMG[title];}
        return tryLang(k+1);
      }).catch(function(){return tryLang(k+1);});
  };
  return tryLang(0);
}

const quizView=document.getElementById("view-quiz");

function buildGame(){
  const pics=shuffle(PICS.map(function(_,i){return i;})).slice(0,20);
  const trivia=shuffle(TOPIC.concat(LATERAL)).slice(0,20);
  const songs=shuffle(SONGS).slice(0,10);
  const words=shuffle(WORDS).slice(0,12);
  const bridges=shuffle(PICS.filter(function(p){return p[2]==="Famous bridges";})).slice(0,8);
  return {
    round:0,phase:"intro",
    scores:[null,null,null,null],
    rounds:[
      {name:"Round 1 — Photos Frenzy!",kind:"pics",note:"One point each. Write what you see; spelling is judged generously.",items:pics},
      {name:"Round 2 — Trivia Blitz!",kind:"trivia",note:"One point each, mixed categories.",items:trivia},
      {name:"Round 3 — Music Mania!",kind:"music",note:"Two points each: title and artist. Here you get a clue instead of the audio.",items:songs},
      {name:"Round 4 — Build a Bridge!",kind:"final",note:"The themed round: twelve word bridges and eight bridges to name from their description.",items:{words:words,bridges:bridges}}
    ],
    answers:[{},{},{},{}],
    marks:[{},{},{},{}]
  };
}

function el(tag,cls,html){const n=document.createElement(tag);if(cls)n.className=cls;if(html!==undefined)n.innerHTML=html;return n;}

function renderQuiz(){
  quizView.innerHTML="";
  if(!game){renderHome();return;}
  const r=game.rounds[game.round];
  if(game.phase==="answer")renderAnswerSheet(r);
  else if(game.phase==="check")renderCheck(r);
  else renderResult();
}

function renderHome(){
  const c=el("div","card");
  c.appendChild(el("h2",null,"Quiz night"));
  c.appendChild(el("p","muted","Four rounds, 20 points each, 80 in total — the real NarrenCastl format. Write your answers, then mark them yourself round by round, exactly as the host does in the break."));
  const b=el("button","btn primary wide");b.textContent="Start a full quiz";
  b.onclick=function(){game=buildGame();game.phase="answer";renderQuiz();};
  c.appendChild(b);
  quizView.appendChild(c);

  if(S.history.length){
    const h=el("div","card");
    h.appendChild(el("h3",null,"Your last attempts"));
    const t=el("table","scoreboard");
    t.innerHTML="<tr><th>Date</th><th class='n'>R1</th><th class='n'>R2</th><th class='n'>R3</th><th class='n'>R4</th><th class='n'>Total</th></tr>";
    S.history.slice(-8).reverse().forEach(function(row){
      const tr=el("tr",null,"<td>"+row.date+"</td>"+row.scores.map(function(s){return "<td class='n'>"+s+"</td>";}).join("")+
        "<td class='n'><b>"+row.total+"</b>/80</td>");
      t.appendChild(tr);
    });
    h.appendChild(t);
    quizView.appendChild(h);
  }
}

function photoBlock(i){
  const box=el("div","photo");
  const ph=el("div","photo-ph","loading photo…");
  box.appendChild(ph);
  const credit=el("div","credit");
  wikiPhoto(PICS[i][3]).then(function(rec){
    if(!rec){ph.textContent="No photo — clue: "+PICS[i][1];box.classList.add("nophoto");return;}
    const im=new Image();im.alt="Picture to identify";im.decoding="async";
    im.onload=function(){ph.remove();box.prepend(im);};
    im.onerror=function(){ph.textContent="No photo — clue: "+PICS[i][1];box.classList.add("nophoto");};
    im.src=rec.src;
    if(rec.page)credit.innerHTML='<a href="'+rec.page+'" target="_blank" rel="noopener">Photo via Wikipedia</a>';
  });
  return [box,credit];
}

function roundHead(r,extra){
  const h=el("div","sheet");
  h.appendChild(el("h2",null,r.name));
  h.appendChild(el("p","muted",r.note));
  if(extra)h.appendChild(extra);
  return h;
}

function renderAnswerSheet(r){
  const head=roundHead(r);
  quizView.appendChild(head);
  const sheet=el("div","sheet");
  const A=game.answers[game.round];

  const addInput=function(key,ph){
    const inp=document.createElement("input");inp.type="text";inp.placeholder=ph||"your answer";
    inp.value=A[key]||"";inp.oninput=function(){A[key]=inp.value;};
    return inp;
  };

  if(r.kind==="pics"){
    r.items.forEach(function(p,n){
      const it=el("div","item");
      it.appendChild(el("div","num",(n+1)+" of 20"));
      photoBlock(p).forEach(function(x){it.appendChild(x);});
      it.appendChild(addInput("p"+n,"what or who is it?"));
      sheet.appendChild(it);
    });
  } else if(r.kind==="trivia"){
    r.items.forEach(function(q,n){
      const it=el("div","item");
      it.appendChild(el("div","num",(n+1)+" · "+q[0]));
      it.appendChild(el("div","qtext",q[1]));
      it.appendChild(addInput("t"+n));
      sheet.appendChild(it);
    });
  } else if(r.kind==="music"){
    r.items.forEach(function(s,n){
      const it=el("div","item");
      it.appendChild(el("div","num",(n+1)+" · 2 points"));
      it.appendChild(el("div","qtext",s[3]+" ("+s[2]+")"));
      const two=el("div","two");
      two.appendChild(addInput("m"+n+"t","title"));
      two.appendChild(addInput("m"+n+"a","artist"));
      it.appendChild(two);
      sheet.appendChild(it);
    });
  } else {
    sheet.appendChild(el("h3",null,"Word bridges — 12 points"));
    r.items.words.forEach(function(w,n){
      const it=el("div","item");
      it.appendChild(el("div","num",(n+1)+" · "+w[0]));
      it.appendChild(el("div","wb",w[1]+' <span>&middot; ? &middot;</span> '+w[3]));
      it.appendChild(addInput("w"+n,"the bridging word"));
      sheet.appendChild(it);
    });
    sheet.appendChild(el("h3",null,"Name that bridge — 8 points"));
    r.items.bridges.forEach(function(b,n){
      const it=el("div","item");
      it.appendChild(el("div","num",(n+13)+""));
      it.appendChild(el("div","qtext",b[1].charAt(0).toUpperCase()+b[1].slice(1)));
      it.appendChild(addInput("b"+n,"which bridge?"));
      sheet.appendChild(it);
    });
  }
  quizView.appendChild(sheet);

  const done=el("button","btn primary wide");done.textContent="Hand in this round";
  done.onclick=function(){game.phase="check";autoMark(r);window.scrollTo(0,0);renderQuiz();};
  quizView.appendChild(done);
}

function autoMark(r){
  const A=game.answers[game.round],M=game.marks[game.round];
  if(r.kind==="pics")r.items.forEach(function(p,n){M["p"+n]=matches(A["p"+n],PICS[p][0],PICS[p][4]);});
  else if(r.kind==="trivia")r.items.forEach(function(q,n){M["t"+n]=matches(A["t"+n],q[2],q[3]);});
  else if(r.kind==="music")r.items.forEach(function(s,n){
    M["m"+n+"t"]=matches(A["m"+n+"t"],s[0],[]);M["m"+n+"a"]=matches(A["m"+n+"a"],s[1],[]);});
  else {
    r.items.words.forEach(function(w,n){M["w"+n]=matches(A["w"+n],w[2],[]);});
    r.items.bridges.forEach(function(b,n){M["b"+n]=matches(A["b"+n],b[0],b[4]);});
  }
}

function markRow(key,given,solution){
  const M=game.marks[game.round];
  const v=el("div","verdict");
  const sol=el("div","sol","<b>"+solution+"</b>"+(given?" &nbsp;·&nbsp; you wrote: "+given.replace(/</g,"&lt;"):" &nbsp;·&nbsp; <i>no answer</i>"));
  const yes=el("button","mark yes");yes.textContent="point";
  const no=el("button","mark no");no.textContent="no point";
  const sync=function(){yes.setAttribute("aria-pressed",!!M[key]);no.setAttribute("aria-pressed",!M[key]);};
  yes.onclick=function(){M[key]=true;sync();updateTally();};
  no.onclick=function(){M[key]=false;sync();updateTally();};
  sync();
  v.appendChild(sol);v.appendChild(yes);v.appendChild(no);
  return v;
}

let tallyNode=null;
function roundScore(r){
  const M=game.marks[game.round];let s=0;
  Object.keys(M).forEach(function(k){if(M[k])s++;});
  return Math.min(s,20);
}
function updateTally(){
  if(tallyNode)tallyNode.textContent=roundScore(game.rounds[game.round])+" / 20 points";
}

    window.scrollTo(0,0);renderQuiz();
  };
  quizView.appendChild(next);
}

function renderResult(){
  const total=game.scores.reduce(function(a,b){return a+b;},0);
  const c=el("div","card");
  c.appendChild(el("h2",null,"Final score"));
  c.appendChild(el("div","big",total+" / 80"));
  const t=el("table","scoreboard");
  t.innerHTML="<tr><th>Round</th><th class='n'>Points</th></tr>";
  ["Photos Frenzy","Trivia Blitz","Music Mania","Build a Bridge"].forEach(function(n,i){
    t.appendChild(el("tr",null,"<td>"+(i+1)+" — "+n+"</td><td class='n'>"+game.scores[i]+" / 20</td>"));
  });
  c.appendChild(t);
  const weakest=game.scores.indexOf(Math.min.apply(null,game.scores));
  c.appendChild(el("p","muted","Weakest round: "+(weakest+1)+". Drill that one before quiz night."));
  const again=el("button","btn primary wide");again.textContent="New quiz";
  again.onclick=function(){game=buildGame();game.phase="answer";window.scrollTo(0,0);renderQuiz();};
  const home=el("button","btn wide");home.textContent="Back to the start";
  home.onclick=function(){game=null;renderQuiz();};
  c.appendChild(again);c.appendChild(home);
  quizView.appendChild(c);
}

/* =========================================================
   DRILL — flashcards
   ========================================================= */
function Chapter(id,items,mount,opts){
  const box=function(i){return (S.drill[id]&&S.drill[id][i])||1;};
  const setBox=function(i,v){S.drill[id]=S.drill[id]||{};S.drill[id][i]=v;save();};
  let cat="All",deck=[],pos=0;
  const cats=["All"].concat(items.map(opts.group).filter(function(v,i,a){return a.indexOf(v)===i;}));
  const inCat=function(i){return cat==="All"||opts.group(items[i])===cat;};
  function build(){
    const idxs=items.map(function(_,i){return i;}).filter(inCat);
    const w=[];idxs.forEach(function(i){const reps=6-Math.min(box(i),5);for(let k=0;k<reps;k++)w.push(i);});
    deck=shuffle(w);pos=0;
  }
  function catRow(){
    const row=el("div","row");
    cats.forEach(function(c){
      const b=el("button","btn"+(c===cat?" primary":""));b.textContent=c;
      b.onclick=function(){cat=c;build();render();};row.appendChild(b);
    });
    return row;
  }
  function render(){
    mount.innerHTML="";
    if(!deck.length)build();
    const card=el("div","card");mount.appendChild(card);
    const pool=items.map(function(_,j){return j;}).filter(inCat);
    const i=deck[pos%deck.length];
    const learned=pool.filter(function(j){return box(j)>=4;}).length;
    card.appendChild(el("div","row spread",'<span class="pill">'+opts.group(items[i])+' · box '+box(i)+
      '</span><span class="muted">'+learned+' of '+pool.length+' in box 4+</span>'));
    const front=opts.front(items[i]);
    front.nodes.forEach(function(n){card.appendChild(n);});
    const a=el("div","a hidden",opts.back(items[i]));
    const row=el("div","row");row.style.marginTop="12px";
    const mk=function(label,cls,fn){const b=el("btn"===cls?"button":"button","btn "+cls);b.textContent=label;b.onclick=fn;row.appendChild(b);};
    mk("Reveal","primary",function(){a.classList.remove("hidden");});
    mk("Knew it","good",function(){setBox(i,Math.min(box(i)+1,5));pos++;if(pos%12===0)build();render();});
    mk("Missed it","bad",function(){setBox(i,1);pos++;render();});
    mk("Skip","",function(){pos++;render();});
    card.appendChild(a);card.appendChild(row);
    const bar=el("div","bar",'<i style="width:'+(pool.length?learned/pool.length*100:0)+'%"></i>');
    card.appendChild(bar);
    mount.appendChild(catRow());
  }
  build();render();
  return {reset:function(){S.drill[id]={};save();build();render();}};
}

const drillMount=document.getElementById("drill-app");
const DRILLS=[
  ["Pictures",function(m){return Chapter("pics",PICS,m,{
    group:function(p){return p[2];},
    front:function(p){const q=el("div","q","What or who is this?");const b=photoBlock(PICS.indexOf(p));
      return {nodes:[q].concat(b)};},
    back:function(p){return "<b>"+p[0]+"</b><br>"+p[1].charAt(0).toUpperCase()+p[1].slice(1);}});}],
  ["Trivia",function(m){return Chapter("topic",TOPIC,m,{
    group:function(t){return t[0];},
    front:function(t){return {nodes:[el("div","q",t[1])]};},
    back:function(t){return t[2];}});}],
  ["Outside the box",function(m){return Chapter("lateral",LATERAL,m,{
    group:function(t){return t[0];},
    front:function(t){return {nodes:[el("div","q",t[1])]};},
    back:function(t){return t[2];}});}],
  ["Word bridges",function(m){return Chapter("words",WORDS,m,{
    group:function(w){return w[0];},
    front:function(w){return {nodes:[el("div","q","Which word bridges the two sides?"),
      el("div","wb",w[1]+' <span>&middot; ? &middot;</span> '+w[3])]};},
    back:function(w){return "<b>"+w[2]+"</b><br>"+w[1]+w[2].toLowerCase()+" · "+w[2]+w[3].toLowerCase();}});}],
  ["Music",function(m){return Chapter("songs",SONGS,m,{
    group:function(){return "Songs";},
    front:function(s){return {nodes:[el("div","q",s[3]+" ("+s[2]+")")]};},
    back:function(s){return "<b>"+s[0]+"</b><br>"+s[1]+", "+s[2];}});}]
];
const drillTabs=document.getElementById("drill-tabs");
let activeDrill=null;
DRILLS.forEach(function(d,n){
  const b=el("button","btn"+(n===0?" primary":""));b.textContent=d[0];
  b.onclick=function(){
    drillTabs.querySelectorAll("button").forEach(function(x,k){x.classList.toggle("primary",k===n);});
    drillMount.innerHTML="";activeDrill=d[1](drillMount);
  };
  drillTabs.appendChild(b);
});
activeDrill=DRILLS[0][1](drillMount);

/* =========================================================
   NAV
   ========================================================= */
const nav=document.getElementById("nav");
[["quiz","Quiz night"],["drill","Drill"]].forEach(function(c){
  const b=el("button","btn");b.textContent=c[1];b.dataset.v=c[0];
  b.onclick=function(){select(c[0]);};nav.appendChild(b);
});
function select(id){
  ["quiz","drill"].forEach(function(v){document.getElementById("view-"+v).hidden=(v!==id);});
  nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("primary",b.dataset.v===id);});
  try{history.replaceState(null,"","#"+id);}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById("resetall").onclick=function(){
  if(!confirm("Delete all saved progress and scores?"))return;
  S={drill:{},history:[]};save();game=null;renderQuiz();
  drillMount.innerHTML="";activeDrill=DRILLS[0][1](drillMount);
};

renderQuiz();
select(location.hash.slice(1)==="drill"?"drill":"quiz");
</script>
