["Why common",'<p>Every other word in the host\'s sentence is natural. <b>“As common as I can possibly make it”</b> is not how anyone phrases that — you would write <i>as easy</i> or <i>as likely</i>. He forced the word in, the same way earlier hints buried <i>focus</i> and <i>bridges</i> in a collage.</p><p>The pattern across the season: he pushes one word through every field it exists in, and he rewards precision. Expect several of the eight angles below, not one.</p>'],
["Superlatives",'<p>His favourite format, and where the points sit, because list questions score per item. Learn these cold.</p><ul class="rank"><li>Element in the universe — <b>hydrogen</b>; in the crust — <b>oxygen</b>; metal in the crust — <b>aluminium</b></li><li>Gas in air — <b>nitrogen</b>, 78 per cent</li><li>Letter in English and German — <b>E</b>; word — <b>the</b> and <b>der</b></li><li>Surname worldwide — <b>Wang</b>; Austria — <b>Gruber</b>; Germany — <b>Müller</b>; England — <b>Smith</b></li><li>Blood type — <b>O positive</b>; rarest — <b>AB negative</b></li><li>Password — <b>123456</b>; PIN — <b>1234</b></li><li>Bird — the <b>domestic chicken</b>; insect order — <b>beetles</b></li><li>Car colour — <b>white</b>; eye colour — <b>brown</b></li></ul>'],
["The institution",'<p>The <b>House of Commons</b>: 650 seats, green benches against the Lords\' red, and “Order, order!” from the Speaker. The <b>Commonwealth of Nations</b> has 56 members and holds its Games every four years. The EEC was the <b>Common Market</b>; the EU\'s biggest budget line is the <b>Common Agricultural Policy</b>. <b>Common law</b> runs on precedent, civil law on a code.</p>'],
["The shared resource",'<p>This is the angle a quizmaster reaches for when he wants something less obvious.</p><ul><li><b>Creative Commons</b> — Lawrence Lessig, 2001. Four elements: BY, SA, NC, ND. Six licences. Only <b>CC BY</b> and <b>CC BY-SA</b> count as free cultural works. <b>CC0</b> waives everything. Current version: <b>4.0</b>.</li><li><b>The Tragedy of the Commons</b> — Garrett Hardin, <i>Science</i>, 1968.</li><li><b>Elinor Ostrom</b> answered him and won the 2009 Nobel in Economic Sciences, the first woman to do so.</li><li>German for common land: <b>Allmende</b>. <b>Boston Common</b>, 1634, is the oldest public park in the United States.</li></ul>'],
["Common versus systematic",'<p>Your home ground, and the trap he has sprung before: when a question gives one name, it wants the other.</p><ul><li>Table salt → <b>sodium chloride</b> · baking soda → <b>sodium hydrogen carbonate</b> · washing soda → <b>sodium carbonate</b></li><li>Caustic soda → <b>sodium hydroxide</b> · quicklime → <b>calcium oxide</b> · slaked lime → <b>calcium hydroxide</b></li><li>Chalk → <b>calcium carbonate</b> · Epsom salt → <b>magnesium sulfate</b> · laughing gas → <b>nitrous oxide</b></li><li>Muriatic acid → <b>hydrochloric acid</b> · saltpetre → <b>potassium nitrate</b> · wood alcohol → <b>methanol</b></li></ul><p>The same rule governs medicines: if the question says <i>substance</i>, the brand scores nothing.</p>'],
["Common as a species name",'<p>English says <i>common</i>, German says <i>gemein</i> or nothing at all — and the two names rarely match, which is exactly why it makes a good question.</p><ul><li>Common buzzard — <b>Mäusebussard</b> · kingfisher — <b>Eisvogel</b> · swift — <b>Mauersegler</b></li><li>Common blackbird — <b>Amsel</b> · raven — <b>Kolkrabe</b> · cuckoo — <b>Kuckuck</b></li><li>Common toad — <b>Erdkröte</b> · beech — <b>Rotbuche</b> · dandelion — <b>Löwenzahn</b></li><li>The common seal is the <b>harbour seal</b>; the common chimpanzee\'s closest relative is the <b>bonobo</b>.</li></ul>'],
["Language and number",'<p><b>Common time</b> is 4/4, written as a C; <b>alla breve</b> is cut common time. The <b>common logarithm</b> is base ten. A <b>common noun</b> is the opposite of a proper one. <b>Common Era</b> gives CE and BCE. Idioms: common ground, common knowledge, common courtesy, <b>common or garden</b> for utterly ordinary, and <b>lowest common denominator</b> for whatever pleases the least demanding audience. In German: <b>Gemeinde</b>, <b>Gemeinwohl</b>, and <i>gemein</i> doing double duty as “common” and “nasty”.</p>'],
["If the theme is really bingo",'<p>The fallback, since the season\'s meta-theme was bingo and he may simply mean it literally.</p><ul><li><b>Ninety balls</b> in Britain, <b>seventy-five</b> in America. The American card is 5×5, columns B-I-N-G-O, free space in the middle.</li><li>It was called <b>beano</b> until a player misshouted; <b>Edwin S. Lowe</b> took the name commercially around 1929.</li><li>Calls: Kelly\'s eye (1), garden gate (8), doctor\'s orders (9), legs eleven (11), two little ducks (22), clickety click (66), two fat ladies (88), top of the shop (90).</li><li>European roulette: <b>37</b> numbers, and they sum to <b>666</b>. Austria plays <b>Lotto 6 aus 45</b>.</li></ul>'],
["On the night",'<p>Three habits that cost you points in September, worth more than any extra fact:</p><ul><li>Answer the <b>kind of thing</b> asked. Substance not brand, film not character, club not ground.</li><li>Order questions are marked on the <b>sequence</b>. Six right colours in the wrong order is zero.</li><li>List questions score <b>per item</b>. Write every candidate you have; there is no penalty for a wrong extra.</li></ul>']
];

/* ===================== ENGINE ===================== */
const el=function(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!==undefined)n.innerHTML=h;return n;};
const $=function(s){return document.querySelector(s);};
const shuffle=function(a){return a.map(function(v){return [Math.random(),v];})
  .sort(function(x,y){return x[0]-y[0];}).map(function(v){return v[1];});};
const norm=function(s){return (s||"").toLowerCase()
  .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g," ")
  .replace(/\b(the|a|an|der|die|das|den|dem|of|von|und|and|in|at)\b/g," ")
  .replace(/\s+/g," ").trim();};
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 99;
  let p=Array.from({length:n+1},function(_,j){return j;});
  for(let i=1;i<=m;i++){const c=[i];
    for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[n];}
function hits(given,correct,alts){
  const g=norm(given);if(!g)return false;
  const pool=[correct].concat(alts||[]).map(norm);
  for(let i=0;i<pool.length;i++){const c=pool[i];if(!c)continue;
    if(g===c)return true;
    const mn=Math.min(g.length,c.length);
    if(mn<=4)continue;
    if(c.indexOf(g)>=0||g.indexOf(c)>=0)return true;
    if(lev(g,c)<=(mn>=12?2:1))return true;}
  return false;}

const KEY="common-prep-v1";
let S={box:{},best:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const box=function(i){return S.box[i]||1;};
const setBox=function(i,v){S.box[i]=v;save();};

/* ---------- briefing ---------- */
function brief(){
  const v=$("#v-brief");v.innerHTML="";
  const lead=el("div","box");
  lead.appendChild(el("h2",null,"The briefing"));
  lead.appendChild(el("p","grey","Read this once the day before and once on the way there. The drills in the other tabs come from it."));
  v.appendChild(lead);
  BRIEF.forEach(function(b,n){
    const s=document.createElement("section");
    s.appendChild(el("div","num",String(n+1).padStart(2,"0")));
    s.appendChild(el("h3",null,b[0]));
    s.appendChild(el("div",null,b[1]));
    v.appendChild(s);});
  const go=el("button","btn go full");go.textContent="Start the flashcards";
  go.onclick=function(){select("cards");};
  go.style.marginTop="26px";
  v.appendChild(go);}

/* ---------- cards ---------- */
let cat="All",deck=[],pos=0;
const cats=["All"].concat(CARDS.map(function(c){return c[0];}).filter(function(v,i,a){return a.indexOf(v)===i;}));
const inCat=function(i){return cat==="All"||CARDS[i][0]===cat;};
function buildDeck(){
  const w=[];
  CARDS.map(function(_,i){return i;}).filter(inCat).forEach(function(i){
    const r=6-Math.min(box(i),5);for(let k=0;k<r;k++)w.push(i);});
  deck=shuffle(w);pos=0;}
function cards(){
  const v=$("#v-cards");v.innerHTML="";
  if(!deck.length)buildDeck();
  const pool=CARDS.map(function(_,i){return i;}).filter(inCat);
  const learned=pool.filter(function(i){return box(i)>=4;}).length;
  const i=deck[pos%deck.length];
  const b=el("div","box");
  b.appendChild(el("div","row between",
    '<span class="kick">'+CARDS[i][0]+'</span><span class="grey">'+learned+' / '+pool.length+' learned</span>'));
  b.appendChild(el("div","q",CARDS[i][1]));
  const a=el("div","a veil",CARDS[i][2]);
  b.appendChild(a);
  const row=el("div","row");row.style.marginTop="12px";
  const mk=function(t,c,f){const x=el("button","btn "+c);x.textContent=t;x.onclick=f;row.appendChild(x);};
  mk("Show","go",function(){a.classList.remove("veil");});
  mk("Knew it","yes",function(){setBox(i,Math.min(box(i)+1,5));pos++;if(pos%10===0)buildDeck();cards();});
  mk("Missed","no",function(){setBox(i,1);pos++;cards();});
  mk("Skip","",function(){pos++;cards();});
  b.appendChild(row);
  b.appendChild(el("div","meter",'<i style="width:'+(pool.length?learned/pool.length*100:0)+'%"></i>'));
  v.appendChild(b);
  const cr=el("div","row");
  cats.forEach(function(c){const x=el("button","btn"+(c===cat?" go":""));x.textContent=c;
    x.onclick=function(){cat=c;buildDeck();cards();};cr.appendChild(x);});
  v.appendChild(cr);}

/* ---------- lists ---------- */
function lists(){
  const v=$("#v-lists");v.innerHTML="";
  const b=el("div","box");
  b.appendChild(el("h2",null,"Lists"));
  b.appendChild(el("p","grey","Type one answer at a time and press enter. These score per item on the night, which is why they are worth practising against a clock."));
  v.appendChild(b);
  LISTS.forEach(function(L,n){
    const p=el("button","pick");
    const best=S.best["L"+n];
    p.innerHTML="<b>"+L.t+"</b><small>"+L.i.length+" items · "+L.s+" seconds"+
      (best!==undefined?(" · best so far: "+best+" / "+L.i.length):"")+"</small>";
    p.onclick=function(){runList(n);};
    v.appendChild(p);});}

function runList(n){
  const L=LISTS[n],v=$("#v-lists");v.innerHTML="";
  const got=L.i.map(function(){return false;});
  let left=L.s,timer=null,over=false;
  const b=el("div","box");
  b.appendChild(el("div","kick","LIST"));
  b.appendChild(el("h2",null,L.t));
  const clock=el("div","clock",String(left));
  const tally=el("div","grey","0 of "+L.i.length);
  b.appendChild(clock);b.appendChild(tally);
  const inp=document.createElement("input");inp.type="text";
  inp.placeholder="an answer, then enter";inp.autocapitalize="off";inp.autocomplete="off";
  b.appendChild(inp);
  const chips=el("div","chips");
  L.i.forEach(function(){chips.appendChild(el("span","chip","?"));});
  b.appendChild(chips);
  const row=el("div","row");
  const stop=el("button","btn no");stop.textContent="Give up";
  const back=el("button","btn");back.textContent="All lists";back.onclick=lists;
  row.appendChild(stop);row.appendChild(back);b.appendChild(row);
  v.appendChild(b);

  function paint(){let c=0;
    got.forEach(function(f,k){if(f){c++;chips.children[k].className="chip got";chips.children[k].textContent=L.i[k][0];}});
    tally.textContent=c+" of "+L.i.length;return c;}
  function finish(reveal){
    if(over)return;over=true;clearInterval(timer);inp.disabled=true;stop.disabled=true;
    const c=paint();
    if(reveal)got.forEach(function(f,k){if(!f){chips.children[k].className="chip miss";chips.children[k].textContent=L.i[k][0];}});
    if(S.best["L"+n]===undefined||c>S.best["L"+n]){S.best["L"+n]=c;save();}
    clock.textContent=c+" / "+L.i.length;clock.classList.toggle("low",c<L.i.length);
    const again=el("button","btn go full");again.textContent="Run it again";
    again.onclick=function(){runList(n);};b.appendChild(again);}
  stop.onclick=function(){finish(true);};
  inp.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    const g=inp.value;inp.value="";if(!g.trim())return;
    for(let k=0;k<L.i.length;k++){if(!got[k]&&hits(g,L.i[k][0],L.i[k][1])){got[k]=true;break;}}
    if(paint()===L.i.length)finish(false);});
  timer=setInterval(function(){left--;clock.textContent=String(left);
    clock.classList.toggle("low",left<=10);if(left<=0)finish(true);},1000);
  setTimeout(function(){try{inp.focus();}catch(e){}},50);}

/* ---------- rapid ---------- */
function rapid(){
  const v=$("#v-rapid");v.innerHTML="";
  const b=el("div","box");
  b.appendChild(el("h2",null,"Rapid"));
  b.appendChild(el("p","grey","Ninety seconds of the deck, typed. Producing an answer under time pressure is its own skill, separate from knowing it."));
  const go=el("button","btn go full");go.textContent="Start 90 seconds";
  go.onclick=runRapid;b.appendChild(go);
  v.appendChild(b);}

function runRapid(){
  const v=$("#v-rapid");v.innerHTML="";
  const order=shuffle(CARDS.map(function(_,i){return i;}));
  let p=0,right=0,asked=0,left=90,timer=null,over=false;
  const b=el("div","box");
  const clock=el("div","clock","90");
  const sc=el("div","grey","0 correct");
  const q=el("div","q","");
  const inp=document.createElement("input");inp.type="text";
  inp.placeholder="answer, then enter";inp.autocapitalize="off";inp.autocomplete="off";
  const fb=el("div","grey","");fb.style.minHeight="1.5em";fb.style.marginTop="8px";
  b.appendChild(el("div","kick","RAPID"));
  b.appendChild(clock);b.appendChild(sc);b.appendChild(q);b.appendChild(inp);b.appendChild(fb);
  const pass=el("button","btn");pass.textContent="Pass";pass.style.marginTop="10px";
  b.appendChild(pass);v.appendChild(b);
  let cur=order[0];
  const show=function(){cur=order[p%order.length];q.textContent=CARDS[cur][1];};
  show();
  const judge=function(ok){
    asked++;
    if(ok){right++;fb.textContent="✓ "+CARDS[cur][2];setBox(cur,Math.min(box(cur)+1,5));}
    else{fb.textContent="→ "+CARDS[cur][2];setBox(cur,1);}
    sc.textContent=right+" correct";p++;show();inp.value="";};
  inp.addEventListener("keydown",function(e){
    if(e.key!=="Enter"||over)return;judge(hits(inp.value,CARDS[cur][2],CARDS[cur][3]));});
  pass.onclick=function(){if(!over)judge(false);};
  timer=setInterval(function(){
    left--;clock.textContent=String(left);clock.classList.toggle("low",left<=10);
    if(left<=0){over=true;clearInterval(timer);inp.disabled=true;pass.disabled=true;
      clock.textContent=right+" / "+asked;
      fb.textContent=right+" answers in ninety seconds, "+(asked?Math.round(right/asked*100):0)+" per cent correct.";
      const again=el("button","btn go full");again.textContent="Go again";again.onclick=runRapid;b.appendChild(again);}
  },1000);
  setTimeout(function(){try{inp.focus();}catch(e){}},50);}

/* ---------- nav ---------- */
const TABS=[["brief","Briefing"],["cards","Cards"],["lists","Lists"],["rapid","Rapid"]];
const tabs=$("#tabs");
TABS.forEach(function(t){
  const x=el("button","tab");x.textContent=t[1];x.dataset.v=t[0];
  x.onclick=function(){select(t[0]);};tabs.appendChild(x);});
function select(id){
  TABS.forEach(function(t){$("#v-"+t[0]).hidden=(t[0]!==id);});
  tabs.querySelectorAll("button").forEach(function(x){x.setAttribute("aria-current",x.dataset.v===id);});
  if(id==="brief")brief();
  if(id==="cards")cards();
  if(id==="lists")lists();
  if(id==="rapid")rapid();
  try{history.replaceState(null,"","#"+id);}catch(e){}
  window.scrollTo(0,0);}
$("#wipe").onclick=function(){
  if(!confirm("Delete all progress and best scores?"))return;
  S={box:{},best:{}};save();buildDeck();select("brief");};
buildDeck();
select(TABS.some(function(t){return t[0]===location.hash.slice(1);})?location.hash.slice(1):"brief");
</script>
